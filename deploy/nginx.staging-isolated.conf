# Staging only. Production retains its existing port-3000 configuration.
server {
    listen 80;
    listen [::]:80;
    server_name taxes-staging.37-27-51-7.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/taxes-staging-acme; }
    location / { return 301 https://taxes-staging.37-27-51-7.nip.io$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taxes-staging.37-27-51-7.nip.io;
    ssl_certificate /etc/letsencrypt/live/taxes-staging.37-27-51-7.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxes-staging.37-27-51-7.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    access_log off;
    error_log /var/log/nginx/taxes-staging-error.log;

    # Strict job/ticket paths; the app validates the one-use token, size and hash.
    location ~ "^/api/v2/property/jobs/[a-f0-9-]{36}/artifact-ingest/[a-f0-9-]{36}$" {
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_buffering off;
    }
}
