# Include from Nginx's http context (for example sites-enabled).
# Provision the certificate first; adjust domain/certificate paths for staging.
limit_req_zone $binary_remote_addr zone=taxes_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=taxes_job_poll:10m rate=120r/m;

server {
    listen 80;
    server_name taxes.zeneral.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name taxes.zeneral.ai;
    ssl_certificate /etc/letsencrypt/live/taxes.zeneral.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxes.zeneral.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;

    # One-use, job-scoped document tickets are validated before reading bytes.
    location ~ "^/api/v2/property/jobs/[a-f0-9-]{36}/artifact-ingest/[a-f0-9-]{36}$" {
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Polling must not consume the ten-per-minute source-submission allowance.
    location ~ "^/api/v2/property/jobs/[a-f0-9-]{36}(/.*)?$" {
        limit_req zone=taxes_job_poll burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=taxes_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
        proxy_connect_timeout 5s;
    }
}
